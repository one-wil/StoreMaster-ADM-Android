name: Build StoreMaster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build StoreMaster APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Extract StoreMaster V11
        run: |
          rm -rf project
          mkdir -p project

          unzip -o "StoreMaster-ADM-Launcher-v11-FINAL-CLEAN.zip" -d project

          echo "===== PROJECT CONTENT ====="
          find project -maxdepth 6 -type f | sort

      - name: Verify project
        run: |
          echo "===== VERIFY ====="

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/app/src/main/java/com/storemaster/adm/MainActivity.java
          test -f project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f project/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "All required files found."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project

          echo "===== BUILD START ====="

          gradle clean assembleDebug --stacktrace

          echo "===== APK CREATED ====="

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreMaster-ADM-APK-V11
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
