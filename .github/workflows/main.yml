name: Build StoreMaster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build StoreMaster APK
    runs-on: ubuntu-latest

    steps:

      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Extract StoreMaster V8 project
        run: |
          unzip -o StoreMaster-ADM-Launcher-v9-CLEAN.zip -d project

          echo "===== PROJECT FILES ====="
          find project -maxdepth 5 -type f | sort

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "===== ANDROID PROJECT ====="
          echo "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle project
        run: |
          cd "$PROJECT_DIR"
          echo "===== PROJECT ROOT ====="
          ls -la

          echo "===== BUILD FILE ====="
          cat app/build.gradle

      - name: Build StoreMaster APK
        run: |
          cd "$PROJECT_DIR"

          echo "===== BUILD START ====="
          gradle assembleDebug --stacktrace

          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreMaster-ADM-APK
          path: |
            project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
